name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official restic
        shell: python
        run: |
          import io, zipfile, hashlib, pathlib, urllib.request
          url = 'https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_windows_amd64.zip'
          raw = urllib.request.urlopen(url, timeout=120).read()
          assert hashlib.sha256(raw).hexdigest() == 'da948ad707ed690426473aaba2046cd61f8f90f6f0e7dab6be0d5796531de67d', 'restic archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              binary = next(n for n in archive.namelist() if n.lower().endswith('.exe'))
              pathlib.Path('restic.exe').write_bytes(archive.read(binary))
          url = 'https://raw.githubusercontent.com/restic/restic/v0.19.1/LICENSE'
          pathlib.Path('RESTIC-LICENSE.txt').write_bytes(urllib.request.urlopen(url, timeout=60).read())
      - name: Test and compile
        shell: powershell
        run: |
          & ([ScriptBlock]::Create([IO.File]::ReadAllText((Join-Path (Get-Location) 'TestCore.ps1'))))
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /reference:System.Windows.Forms.dll /win32icon:bitXrestic.ico /resource:bitXrestic.ico,bitXrestic.ico /resource:restic.exe,restic.exe /resource:Export.ps1,Export.ps1 /out:bitXrestic.exe Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: bitXrestic-0.3.9-Windows
          path: |
            bitXrestic.exe
            RESTIC-LICENSE.txt
            README.md
          if-no-files-found: error
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.3.9'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "bitXrestic 0.3.9" --notes "Windows portable executable with bundled restic. Download bitXrestic.exe and RESTIC-LICENSE.txt. Core tests and compilation pass on Windows; test actual exports on a small repository first."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag bitXrestic.exe RESTIC-LICENSE.txt --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
